name: Options Floor

on:
  schedule:
    # 10:15 US Eastern Standard Time. During daylight time this is 11:15 ET.
    - cron: "15 15 * * 1-5"
    # 18:30 US Eastern Standard Time. During daylight time this is 19:30 ET.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-floor
  cancel-in-progress: false

jobs:
  ideas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and test the research job
        run: |
          python -m pip install -r requirements.txt
          python -m pytest
      - name: Build today's idea file
        run: python -m pipeline.run
      - name: Test and build the site
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Publish the idea file and the site
        run: |
          git config user.name "options-floor"
          git config user.email "actions@users.noreply.github.com"
          git add data web/public/data docs
          if git diff --staged --quiet; then
            echo "No file changes."
          else
            git commit -m "Update Options Floor ideas"
            git push
          fi
